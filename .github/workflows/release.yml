name: Release

# Tag v* publishes Arch ([mason] via GitHub Release + arch-repo dispatch)
# and COPR (solaris765/hypr-de-extras). Both channels are required.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  arch-package:
    name: makepkg → namcap
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install build tooling
        run: >-
          pacman -Syu --noconfirm --needed base-devel git sudo namcap
          github-cli pacman-contrib curl gnupg
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Version consistency gate
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::tag v$tag does not match PKGBUILD pkgver=$pkgver"
            exit 1
          fi
      - name: Source integrity policy
        run: |
          if grep -Eq "^[[:space:]]*[[:alnum:]]+sums=.*['\"]SKIP['\"]" packaging/PKGBUILD; then
            echo "::error::PKGBUILD source checksums may not use SKIP"
            exit 1
          fi
      - name: Prepare unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: Build package
        run: |
          cd packaging
          su builder -c 'makepkg -s --noconfirm'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: arch-package
          path: packaging/*.pkg.tar.zst

  rpm-check:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rpm-check.yml@429e647539b02e85ea59b38c441f83a86ee77835
    with:
      spec-name: overskride

  publish-release:
    name: Publish gated GitHub Release
    needs: [arch-package, rpm-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: arch-package
          path: dist
      - name: Publish package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.pkg.tar.zst --clobber

  copr:
    name: Publish to COPR
    needs: publish-release
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:42@sha256:e78cd1a688cd079c23864f289a89a49a3f4ad66d817864e325e1d058310ee95c
    steps:
      - name: Install build tooling
        run: dnf -y install git-core copr-cli rpm-build rpmlint rpmdevtools curl-minimal
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Build SRPM and submit
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: hypr-de-extras
        run: |
          set -euo pipefail
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::COPR_CONFIG is required — a release must publish COPR"
            exit 1
          fi
          git config --global --add safe.directory "$(pwd)"
          mkdir -p ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          if ! copr-cli list-packages "$COPR_PROJECT" >/dev/null 2>&1; then
            echo "==> creating COPR project $COPR_PROJECT"
            copr-cli create "$COPR_PROJECT" \
              --chroot fedora-42-x86_64 \
              --chroot fedora-43-x86_64 \
              --chroot fedora-rawhide-x86_64 \
              --description "Third-party packages hypr-DE needs that Fedora, nett00n/hyprland, and heus-sueh/packages do not ship."
          fi
          copr-cli modify "$COPR_PROJECT" --enable-net on
          bash packaging/build-srpm.sh --copr

  update-arch-repo:
    name: Republish arch-repo
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch to MasonRhodesDev/arch-repo
        env:
          TOKEN: ${{ secrets.ARCH_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ARCH_REPO_TOKEN is required — a release must republish [mason]"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MasonRhodesDev/arch-repo/dispatches \
            -d '{"event_type":"package-released"}'
