name: Release

# Tag v* publishes Arch ([mason] via GitHub Release + arch-repo dispatch)
# and COPR (solaris765/hypr-de-extras). Both channels are required.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@43f34aaaa95951ebf71e625de3cf1207e2a259e6
    secrets: inherit
    with:
      spec-name: overskride
      skip-head-snapshot: true
      copr-project: hypr-de-extras
      copr-enable-net: true
